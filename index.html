<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18181B;--bg:#F4F4F5;--yellow:#FACC15;--blue:#1D4ED8;--muted:#52525B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.display{font-family:Bangers,Inter,sans-serif;letter-spacing:.5px;font-weight:400}
h1,h2,h3{margin:0}
.panel{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:18px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;background:#fff;color:var(--ink);font-weight:800;font-size:16px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--blue);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.big{font-family:Bangers,Inter,sans-serif;font-weight:400;font-size:30px;letter-spacing:1px;padding:12px 26px}
.btn.small{min-height:40px;font-size:14px;padding:6px 12px;border-width:2px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:4px solid #93C5FD;outline-offset:2px}
.label{font-size:13px;font-weight:800;letter-spacing:2px;color:#3F3F46;text-transform:uppercase}
.muted{color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;background:#fff}
.avatar{border:2px solid var(--ink);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#E4E4E7;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .def{color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:260px;max-width:100%}
.pad button{height:70px;font-family:Bangers,Inter,sans-serif;font-size:32px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink)}
.pad button.go{background:var(--blue);color:#fff}
.pad button.del{background:#E4E4E7;font-size:22px}
.pad button:active{transform:translateY(2px)}
.question{font-family:Bangers,Inter,sans-serif;font-size:clamp(60px,9vw,104px);line-height:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.ansbox{min-width:140px;height:1.15em;border:4px solid var(--blue);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;background:#fff}
.hp{height:20px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.hp>div{height:100%;background:#DC2626;transition:width .35s}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.grid{display:flex;flex-direction:column;gap:5px}
.grow{display:flex;gap:5px}
.gdot{width:24px;height:24px;border-radius:999px;border:2px solid var(--ink)}
.gdot.off{border:2px dashed #A1A1AA;background:transparent}
.rank{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{border:2px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff;align-items:center;text-align:center}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.steps li.now{font-weight:800}
.note{background:#FEF9C3;border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.flash>div{background:var(--yellow);border:4px solid var(--ink);border-radius:20px;padding:18px 30px;display:flex;align-items:center;gap:18px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90vw}
input[type=text]{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:10px;width:100%;font-size:15px}
.slot{display:flex;gap:12px;align-items:center;border:2px dashed #A1A1AA;border-radius:12px;padding:10px;flex-wrap:wrap;transition:background .15s,border-color .15s}
.slot.active{border:2px solid var(--ink);box-shadow:0 0 0 3px var(--yellow)}
.slot.drag{border:3px solid var(--blue);background:#DBEAFE}
.slot .hint{font-size:12px;color:var(--muted)}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:800;font-size:14px;min-height:40px;cursor:pointer;background:#fff}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #E4E4E7}
.roster{margin-top:16px;padding:12px 16px}
.roster-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rstrip{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 4px}
.rcell{flex:0 0 118px;border:2px solid #D4D4D8;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;background:#fff;position:relative}
.rcell.right{border-color:#15803D;background:#F0FDF4}
.rcell.wrong{border-color:#B91C1C;background:#FEF2F2}
.rcell.now{border:3px solid var(--blue);background:#EFF6FF}
.rcell.todo .avatar{opacity:.55}
.rbadge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;color:#fff}
.rbadge.right{background:#15803D}.rbadge.wrong{background:#B91C1C}.rbadge.now{background:var(--blue)}
.rbadge.todo{background:#E4E4E7;color:#3F3F46}
.rformula{font-family:Bangers,Inter,sans-serif;font-size:20px;line-height:1}
.rgiven{font-size:11px;color:#7F1D1D}
.rcell{padding-top:12px;overflow:hidden}
.rstripe{position:absolute;left:0;right:0;top:0;height:6px}
.tchip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.3px}
.rformula.ask{color:#3F3F46}
.sumchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;border:2px solid currentColor}
.hthumbs{display:flex;gap:8px;flex-wrap:wrap}
.ht{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.ht .avatar{border-width:3px}
.ht.off .avatar{position:relative;border-style:dashed;border-color:#52525B}
.ht.off .avatar::after,.lockwrap .avatar::after{content:'';position:absolute;inset:0;pointer-events:none}
.ht.lk .avatar::after,.lockwrap .avatar::after{background:rgba(24,24,27,.38)}
.ht.unp .avatar::after{background:rgba(255,255,255,.35)}
.ht .lockmini{position:absolute;left:50%;top:24px;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,.92);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;pointer-events:none}
.lockwrap{position:relative;display:inline-block}
.lockwrap .avatar{position:relative;border-style:dashed;border-color:#52525B}
.lockbadge{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:999px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.card.locked{background:#FAFAFA;border-style:dashed}
.ht.on .avatar{box-shadow:0 0 0 3px var(--yellow)}
.ht .bolt{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:999px;background:var(--yellow);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.ht .lbl{font-size:11px;font-weight:800;color:#3F3F46}
.ht.off .lbl{color:#71717A;font-weight:600}
.hlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#3F3F46}
.homelink{display:inline-flex;align-items:center;gap:10px;background:none;border:none;padding:4px 8px;margin-left:-8px;border-radius:12px;cursor:pointer;color:var(--ink);font:inherit}
.homelink .display{font-size:42px;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--yellow)}
.homelink:hover{background:#FEF9C3}
.homelink:hover .display{color:var(--blue);text-decoration-color:var(--blue)}
.homechip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;background:#fff}
.homelink:hover .homechip{background:var(--yellow)}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px}
.hero2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
.vrow{display:flex;gap:18px;align-items:center}
.vhead{font-family:Bangers,Inter,sans-serif;font-size:clamp(26px,3.6vw,36px);line-height:1}
.shield{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
.seg{height:22px;border-radius:4px;border:2px solid var(--ink);background:#7C3AED}
.seg.broken{background:#F4F4F5;border-style:dashed}
.nextcard{background:#FEF9C3;border:4px solid var(--ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.nextcard .btn.big{margin-top:auto}
.howto{background:#fff;border:2px solid #D4D4D8;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.loopbox{flex:1 1 420px;border:2px dashed #A1A1AA;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.loophead{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1px;color:#3F3F46;gap:8px}
.loopsteps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.step{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:2px solid #E4E4E7;background:#fff;font-size:13px;line-height:1.25}
.step.active{background:#FEF9C3;border-color:var(--ink)}
.step.done{background:#F0FDF4;border-color:#86EFAC}
.stepnum{width:26px;height:26px;border-radius:999px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#fff;flex-shrink:0}
.step.active .stepnum{background:var(--yellow)}
.step.done .stepnum{background:#15803D;color:#fff}
.finalstep{flex:0 1 230px}
.pathhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:none;padding:6px 0;font:inherit;font-weight:700;font-size:14px;color:var(--blue);text-decoration:underline;cursor:pointer;min-height:40px}
.linkbtn:hover{color:#1E3A8A}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.chap{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chap.locked{background:#FAFAFA;border:2px dashed #A1A1AA}
.chap.done{background:#F0FDF4;border:2px solid #15803D}
.chap .acts{margin-top:auto;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.chip{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.cbar{width:6px;height:26px;border-radius:3px;flex-shrink:0}
.hthumbs.sm .ht .avatar{border-width:2px}
.banner{background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:16px 20px;margin-bottom:16px}
@media (max-width:760px){
  .hero2{grid-template-columns:1fr}
  .vrow .avatar{width:64px!important;height:64px!important}
  .vrow{gap:12px}
  .loopsteps{grid-template-columns:1fr}
  .finalstep{flex:1 1 100%}
  .seg{height:14px}
}
@media (max-width:700px){.pad button{height:58px}.wrap{padding:12px}}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="display" style="font-size:40px">HERO ACADEMY</p><p class="muted">Loading…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ---------- Data model ---------- */
const TEAMS={
  D:{name:'The Doublers',power:'Double, then double again',color:'#1D4ED8',lessons:[{a:4,b:7},{a:8,b:6,note:'For 8s, use the power one more time: double, double, double!'}],practice:{a:4,b:6},stage:['#1D4ED8','#60A5FA','#FACC15','#F97316']},
  T:{name:'Trio Force',power:'2 groups + 1 more group',color:'#6D28D9',lessons:[{a:3,b:6}],practice:{a:3,b:8},stage:['#A1A1AA','#FACC15']},
  P:{name:'Plus-One Squad',power:'5 groups + the rest',color:'#BE185D',lessons:[{a:6,b:7}],practice:{a:6,b:6},stage:['#A1A1AA','#FACC15']}
};
const TEAM_ORDER=['D','T','P'];
const TEAM_SHORT={D:'Doublers',T:'Trio Force',P:'Plus-One'};
const TEAM_POSS={D:"The Doublers'",T:"Trio Force's",P:"The Plus-One Squad's"};
const REVIEW_SLOTS=2;
const TEAM_PLURAL={D:'Doublers',T:'Trio Force heroes',P:'Plus-One Squad heroes'};
const FACTS=[['D',4,4],['D',4,6],['D',4,7],['D',4,8],['D',8,6],['D',8,7],['D',8,8],['T',3,3],['T',3,4],['T',3,6],['T',3,7],['T',3,8],['P',6,6],['P',6,7],['P',7,7]]
  .map(function(x){return {k:x[1]+'x'+x[2],a:x[1],b:x[2],team:x[0]};});
const RANKS=['Locked','Recruit','Bronze','Silver','Gold','Legend'];
const RANK_BG=['#FFFFFF','#E4E4E7','#FED7AA','#DBEAFE','#FACC15','#DDD6FE'];
const INTERVAL_DAYS=[0,0,1,3,7,21];
const DAY=86400000;
const FAST_MS=3000;
const MISSION_FACTS=10, WARMUPS=2;

/* ---------- Storage: private per-viewer db, else this browser, else memory ---------- */
const DATA={}; const SHARED={}; let DB=null; let IS_OWNER=false; let MODE='memory'; let COL=null; const chains={}; const LS='hero-academy-v1';
function clone(o){return JSON.parse(JSON.stringify(o));}
async function initStore(){
  let timer;
  const timeout=new Promise(function(r){timer=setTimeout(function(){r('timeout');},10000);});
  try{
    const res=await Promise.race([(async function(){
      if(typeof claude==='undefined'||!claude||!claude.use) return null;
      const db=await claude.use('db'); const user=await claude.use('user');
      if(!db||!user) return null;
      const id=await user.id(); if(!id) return null;
      const col=db.collection('data/users/'+id);
      const snap=await col.get();
      try{ IS_OWNER=!!(await Promise.resolve(user.isOwner())); }catch(e){}
      let canWrite=null; try{ canWrite=await Promise.resolve(user.can('data.write')); }catch(e){}
      try{ const sh=await db.collection('shared').get(); sh.docs.forEach(function(d){ if(d.exists) SHARED[d.id]=clone(d.data()); }); }catch(e){}
      return {col:col,snap:snap,db:db,canWrite:canWrite};
    })(),timeout]);
    clearTimeout(timer);
    if(res&&res!=='timeout'&&res.canWrite===false){
      /* Viewer/Commenter: read the shared setup, keep own progress in this browser */
      DB=res.db; useLocal(); return;
    }
    if(res&&res!=='timeout'){
      MODE='db'; COL=res.col; DB=res.db;
      res.snap.docs.forEach(function(d){ if(d.exists){ DATA[d.id]=clone(d.data()); } });
      return;
    }
  }catch(e){ clearTimeout(timer); }
  useLocal();
}
function useLocal(){
  try{ const raw=localStorage.getItem(LS); MODE='local'; if(raw){ Object.assign(DATA,JSON.parse(raw)); } }
  catch(e){ MODE='memory'; }
}
let switchedLocal=false;
function fallBackToLocal(){
  if(switchedLocal) return; switchedLocal=true; MODE='local';
  try{ localStorage.setItem(LS,JSON.stringify(DATA)); }catch(e){ MODE='memory'; }
  toast('Your progress will save in this browser.');
}
function put(id,obj){
  DATA[id]=obj;
  if(MODE==='db'){
    chains[id]=(chains[id]||Promise.resolve()).then(function(){return COL.doc(id).set(clone(DATA[id]));})
      .catch(function(e){
        if(e&&e.code==='unavailable'){
          return new Promise(function(r){setTimeout(r,700+Math.random()*900);})
            .then(function(){return COL.doc(id).set(clone(DATA[id]));})
            .catch(function(){toast("Couldn't save that change. Check your connection.");});
        }
        if(e&&e.code==='quota_exceeded'){toast('Storage is full. Try smaller pictures.');return;}
        if(e&&(e.code==='invalid_argument'||e.code==='not_granted')){ fallBackToLocal(); return; }
        toast("Couldn't save that change.");
      });
  }else if(MODE==='local'){
    try{ localStorage.setItem(LS,JSON.stringify(DATA)); }
    catch(e){ toast("This browser couldn't save that (pictures may be too big)."); }
  }
}

function prog(){
  let p=DATA.progress;
  if(!p){ p={lessons:{D:false,T:false,P:false},facts:{},streak:{last:null,days:0},missions:0}; DATA.progress=p; }
  FACTS.forEach(function(f){ if(!p.facts[f.k]) p.facts[f.k]={rank:0,due:0,times:[]}; });
  if(!p.poweredEver){ p.poweredEver={}; FACTS.forEach(function(f){ if(p.facts[f.k].rank>=2) p.poweredEver[f.k]=true; }); }
  return p;
}
/* Your own setup wins; otherwise fall back to the setup the owner shared */
function merged(id){ const own=DATA[id]||{}, sh=SHARED[id]||{}; return {name:own.name||sh.name||'', img:safeImg(own.img)||safeImg(sh.img)||''}; }
function chapterFacts(t){ return FACTS.filter(function(f){return f.team===t;}); }
function chapterDone(t){ const p=prog(); return chapterFacts(t).every(function(f){return p.poweredEver[f.k];}); }
function currentChapter(){ for(let i=0;i<TEAM_ORDER.length;i++){ if(!chapterDone(TEAM_ORDER[i])) return TEAM_ORDER[i]; } return null; }
function poweredCount(t){ const p=prog(); return chapterFacts(t).filter(function(f){return p.poweredEver[f.k];}).length; }
function heroOf(k){ return merged('hero-'+k); }
function villainOf(){ return merged('villain'); }
function placeName(){ return merged('settings').name||'your school'; }
function heroName(f){ return heroOf(f.k).name||('Hero '+f.a+'×'+f.b); }
function villainName(){ return villainOf().name||'The Villain'; }
function safeImg(s){ return (typeof s==='string'&&s.indexOf('data:image/')===0)?s:''; }

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function median(a){ if(!a||!a.length) return null; const s=a.slice().sort(function(x,y){return x-y;}); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function factByKey(k){ return FACTS.find(function(f){return f.k===k;}); }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.style.display='none';},Math.max(3500,msg.length*60)); }

function avatarHTML(f,size){
  const h=heroOf(f.k), img=safeImg(h.img), t=TEAMS[f.team];
  const inner=img?'<img src="'+img+'" alt="'+esc(heroName(f))+'">'
    :'<div class="def display" style="background:'+t.color+';font-size:'+Math.max(14,Math.round(size/3.6))+'px">'+f.a+'×'+f.b+'</div>';
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px">'+inner+'</div>';
}
function villainAvatar(size){
  const img=safeImg(villainOf().img);
  const inner=img?'<img src="'+img+'" alt="'+esc(villainName())+'">'
    :'<div class="def display" style="background:#3F3F46;font-size:'+Math.max(14,Math.round(size/4.5))+'px">VILLAIN</div>';
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px">'+inner+'</div>';
}
const ICON_LOCK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICON_LOCK_S=ICON_LOCK.replace('width="14" height="14"','width="11" height="11"');

/* ---------- Strategy visuals ---------- */
function strategySteps(a,b,team){
  if(team==='D'){
    const s=[{rows:1,text:'Start with one group of '+b+': 1 × '+b+' = '+b},
      {rows:2,text:'DOUBLE it: '+b+' + '+b+' = '+(2*b)},
      {rows:4,text:'DOUBLE again: '+(2*b)+' + '+(2*b)+' = '+(4*b)}];
    if(a===8) s.push({rows:8,text:'DOUBLE one more time: '+(4*b)+' + '+(4*b)+' = '+(8*b)});
    return s;
  }
  if(team==='T') return [{rows:2,text:'2 groups of '+b+' = '+(2*b)+' (your 2s!)'},{rows:3,text:'+ one more '+b+': '+(2*b)+' + '+b+' = '+(3*b)}];
  if(team==='P'){
    const extra=a-5;
    return [{rows:5,text:'5 groups of '+b+' = '+(5*b)+' (your 5s!)'},
      {rows:a,text:extra===1?('+ one more '+b+': '+(5*b)+' + '+b+' = '+(a*b)):('+ '+extra+' more groups of '+b+' ('+(extra*b)+'): '+(5*b)+' + '+(extra*b)+' = '+(a*b))}];
  }
  return [{rows:a,text:a+' groups of '+b+' = '+(a*b)}];
}
function gridHTML(a,b,team,visibleRows){
  const steps=strategySteps(a,b,team);
  const stage=(TEAMS[team]&&TEAMS[team].stage)||['#A1A1AA'];
  let html='<div class="grid" role="img" aria-label="'+a+' rows of '+b+' dots">';
  for(let r=0;r<a;r++){
    let si=steps.findIndex(function(s){return r<s.rows;}); if(si<0) si=steps.length-1;
    const on=r<visibleRows; const color=stage[Math.min(si,stage.length-1)];
    html+='<div class="grow">';
    for(let c=0;c<b;c++) html+='<div class="gdot'+(on?'':' off')+'" style="'+(on?'background:'+color:'')+'"></div>';
    html+='</div>';
  }
  return html+'</div>';
}

/* ---------- Game logic ---------- */
function applyResult(k,correct,ms){
  const p=prog(); const s=p.facts[k]; const from=s.rank; let to;
  if(correct){ s.times=(s.times||[]).concat([Math.round(ms)]).slice(-6); to=(from>=3&&ms>=FAST_MS)?from:Math.min(5,from+1); }
  else{ to=Math.max(1,from-1); }
  s.rank=to;
  if(to>=2) p.poweredEver[k]=true;
  s.due=(!correct||to<=1)?Date.now():startOfDay(Date.now())+INTERVAL_DAYS[to]*DAY;
  S.m.changes.push({k:k,from:from,to:to});
}
function buildMission(){
  const p=prog(); const now=Date.now(); const cur=currentChapter(); const boss=!cur;
  const byNeed=function(x,y){return p.facts[x.k].rank-p.facts[y.k].rank||p.facts[x.k].due-p.facts[y.k].due;};
  let main, review=[];
  if(boss){ main=FACTS.slice(); }
  else{
    if(!p.lessons[cur]) return null;
    main=chapterFacts(cur).filter(function(f){return p.facts[f.k].rank>0;});
    const doneTeams=TEAM_ORDER.slice(0,TEAM_ORDER.indexOf(cur));
    review=FACTS.filter(function(f){return doneTeams.indexOf(f.team)>=0&&p.facts[f.k].rank>0&&p.facts[f.k].due<=now;})
      .sort(function(x,y){return p.facts[x.k].due-p.facts[y.k].due;}).slice(0,REVIEW_SLOTS);
  }
  if(!main.length) return null;
  const n=MISSION_FACTS-review.length;
  const due=main.filter(function(f){return p.facts[f.k].due<=now;}).sort(byNeed);
  const later=main.filter(function(f){return p.facts[f.k].due>now;}).sort(byNeed);
  const picks=due.concat(later).slice(0,n);
  let i=0; const pool=main.slice().sort(byNeed);
  while(picks.length<n){ picks.push(pool[i%pool.length]); i++; }
  const items=picks.map(function(f){return {type:'fact',k:f.k,a:f.a,b:f.b,team:f.team,flip:Math.random()<0.5};})
    .concat(review.map(function(f){return {type:'fact',k:f.k,a:f.a,b:f.b,team:f.team,flip:Math.random()<0.5,review:true};}));
  const known=[5,9,10,11]; const usedW={};
  for(let w=0;w<WARMUPS;w++){
    let a,b,key; do{ a=known[Math.floor(Math.random()*known.length)]; b=2+Math.floor(Math.random()*8); key=a+'x'+b; }while(usedW[key]); usedW[key]=1;
    items.push({type:'warm',k:'w'+key,a:a,b:b,team:'W',flip:Math.random()<0.5});
  }
  for(let t=0;t<60;t++){ shuffle(items); let ok=true; for(let j=1;j<items.length;j++){ if(items[j].k===items[j-1].k){ok=false;break;} } if(ok) break; }
  return {items:items,idx:0,hits:0,target:items.length,firstTry:0,seen:{},changes:[],boss:boss,chapter:cur,startDone:cur?chapterDone(cur):false};
}
function showQuestion(){ go('mission'); startInput(submitMission); }
function flash(html,ms,then){
  const el=document.createElement('div'); el.className='flash'; el.innerHTML='<div>'+html+'</div>'; document.body.appendChild(el);
  S.padActive=false; setTimeout(function(){ el.remove(); then(); },ms);
}
function submitMission(val){
  const m=S.m; const it=m.items[m.idx]; const ms=performance.now()-S.qStart;
  const right=parseInt(val,10)===it.a*it.b;
  const first=it.type==='fact'&&!m.seen[it.k];
  if(right){
    it.result='right';
    m.hits=Math.min(m.target,m.hits+1);
    if(!it.requeued) m.firstTry++;
    if(first){ m.seen[it.k]=1; applyResult(it.k,true,ms); }
    const pic=it.type==='fact'?avatarHTML(factByKey(it.k),90):'';
    flash(pic+'<span class="display" style="font-size:64px">POW!</span>',750,nextQuestion);
  }else{
    if(first){ m.seen[it.k]=1; applyResult(it.k,false,ms); }
    if(!it.requeued){ const copy=Object.assign({},it,{requeued:true}); delete copy.result; delete copy.given; m.items.splice(Math.min(m.idx+3,m.items.length),0,copy); }
    it.result='wrong'; it.given=val;
    S.room={it:it}; go('room'); startInput(submitRoom);
  }
}
function submitRoom(val){
  const it=S.room.it;
  if(parseInt(val,10)===it.a*it.b){ flash('<span class="display" style="font-size:52px">POWERED UP!</span>',700,nextQuestion); }
  else{ S.input=''; const b=document.getElementById('ans'); if(b) b.textContent=''; shakeAns(); toast('Count the dots in each step, then try again.'); }
}
function nextQuestion(){
  const m=S.m; m.idx++;
  if(m.idx>=m.items.length) return finishMission();
  showQuestion();
}
function finishMission(){
  const p=prog(); const today=dayKey(Date.now()); const yest=dayKey(Date.now()-DAY);
  if(p.streak.last!==today){ p.streak.days=(p.streak.last===yest)?(p.streak.days||0)+1:1; p.streak.last=today; }
  p.missions=(p.missions||0)+1;
  const m=S.m;
  if(m.boss){ p.bossWins=(p.bossWins||0)+1; }
  else if(m.chapter&&!m.startDone&&chapterDone(m.chapter)){ m.chapterCompleted=m.chapter; }
  put('progress',p); go('debrief');
}
function submitPractice(val){
  const L=S.lesson; const t=TEAMS[L.team];
  if(parseInt(val,10)===t.practice.a*t.practice.b){
    const p=prog(); L.wasReview=!!p.lessons[L.team]; p.lessons[L.team]=true;
    FACTS.forEach(function(f){ if(f.team===L.team&&p.facts[f.k].rank===0){ p.facts[f.k].rank=1; p.facts[f.k].due=Date.now(); } });
    put('progress',p); L.phase='done'; go('lesson');
  }else{
    L.miss=true; go('lesson'); startInput(submitPractice); shakeAns();
  }
}

function setupIds(){ return ['villain','settings'].concat(FACTS.map(function(f){return 'hero-'+f.k;})); }
async function shareSetup(){
  if(!DB||!IS_OWNER||S.sharing) return;

    const sc=DB.collection('shared');

      else if(SHARED[id]){ await sc.doc(id).delete(); delete SHARED[id]; }

async function unshareSetup(){

/* ---------- Pictures ---------- */
function fileToDataUrl(file){ return srcToDataUrl(URL.createObjectURL(file)); }
function saveImage(id,promise){
  promise.then(function(url){ const cur=Object.assign({},DATA[id]||{}); cur.img=url; put(id,cur); S.activeSlot=id; render(); toast('Picture added.'); })
    .catch(function(){ toast('That could not be read as a picture.'); });
}
function imageFileFrom(list){
  if(!list) return null;
  for(let i=0;i<list.length;i++){
    const it=list[i];
    if(it.kind==='file'&&it.type&&it.type.indexOf('image/')===0){ return it.getAsFile(); }
    if(it instanceof File&&it.type.indexOf('image/')===0){ return it; }
  }
  return null;
}
function srcToDataUrl(url){
  return new Promise(function(res,rej){
    const img=new Image();
    img.onload=function(){
      const max=320; const s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

    if(L.step<n-1){L.step++;go('lesson');}
    else if(L.ex<t.lessons.length-1){L.ex++;L.step=0;go('lesson');}

  },

  quit:function(){ if(S.m&&S.m.changes.length) put('progress',prog()); go('home'); },
  key:function(k){padKey(k);},

  toggleRoster:function(){
    S.rosterOpen=S.rosterOpen===false;
    try{ localStorage.setItem('hero-academy-roster',S.rosterOpen?'1':'0'); }catch(e){}
    render();
    S.qStart=performance.now(); /* restart the clock so opening/closing doesn't count against answer speed */
  },
  clearImg:function(id){ const cur=Object.assign({},DATA[id]||{}); delete cur.img; put(id,cur); render(); },
  askReset:function(){S.confirmReset=true;render();},
  cancelReset:function(){S.confirmReset=false;render();},
  doReset:function(){ delete DATA.progress; put('progress',prog()); S.confirmReset=false; toast('Progress reset.'); render(); }
};
app.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const fn=ACT[b.dataset.act]; if(fn) fn(b.dataset.arg,b);
});
app.addEventListener('change',function(e){
  const el=e.target;
  if(el.dataset.file){
    const id=el.dataset.file; const f=el.files&&el.files[0]; if(!f) return;
    saveImage(id,fileToDataUrl(f));
  }else if(el.dataset.name){
    const id=el.dataset.name; const cur=Object.assign({},DATA[id]||{}); const v=el.value.trim().slice(0,40);
    if(cur.name===v) return; cur.name=v; put(id,cur);
  }
});
/* Drag-and-drop and paste for picture slots */
function setActiveSlot(id){
  S.activeSlot=id;
  app.querySelectorAll('.slot').forEach(function(s){ s.classList.toggle('active',s.dataset.slot===id); });
}
app.addEventListener('focusin',function(e){ const s=e.target.closest&&e.target.closest('[data-slot]'); if(s) setActiveSlot(s.dataset.slot); });
app.addEventListener('mousedown',function(e){ const s=e.target.closest('[data-slot]'); if(s) setActiveSlot(s.dataset.slot); });
app.addEventListener('dragover',function(e){
  const s=e.target.closest('[data-slot]'); if(!s) return;
  e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
  app.querySelectorAll('.slot.drag').forEach(function(x){ if(x!==s) x.classList.remove('drag'); });
  s.classList.add('drag');
});
app.addEventListener('dragleave',function(e){
  const s=e.target.closest('[data-slot]'); if(s&&!s.contains(e.relatedTarget)) s.classList.remove('drag');
});
app.addEventListener('drop',function(e){
  const s=e.target.closest('[data-slot]'); if(!s) return;
  e.preventDefault(); s.classList.remove('drag');
  const id=s.dataset.slot; const dt=e.dataTransfer; if(!dt) return;
  const file=imageFileFrom(dt.files)||imageFileFrom(dt.items);
  if(file){ saveImage(id,fileToDataUrl(file)); return; }
  const uri=(dt.getData('text/uri-list')||dt.getData('text/plain')||'').trim();
  const html=dt.getData('text/html')||'';
  const m=html.match(/src="(data:image\/[^"]+)"/);
  const dataSrc=uri.indexOf('data:image/')===0?uri:(m?m[1]:'');
  if(dataSrc){ saveImage(id,srcToDataUrl(dataSrc)); return; }
  setActiveSlot(id);
  toast('That site only sent a link, not the picture. Right-click the picture, choose "Copy Image", then click this box and paste (Ctrl+V / ⌘V).');
});
/* Stop a missed drop from navigating the page away */
document.addEventListener('dragover',function(e){ if(!e.target.closest||!e.target.closest('[data-slot]')) e.preventDefault(); });
document.addEventListener('drop',function(e){ if(!e.target.closest||!e.target.closest('[data-slot]')){ e.preventDefault(); if(S.view==='setup') toast('Drop the picture onto one of the hero boxes.'); } });
document.addEventListener('paste',function(e){
  if(S.view!=='setup') return;
  const file=imageFileFrom(e.clipboardData&&e.clipboardData.items)||imageFileFrom(e.clipboardData&&e.clipboardData.files);
  if(!file) return;
  e.preventDefault();
  if(!S.activeSlot){ toast('Click a hero box first, then paste.'); return; }
  saveImage(S.activeSlot,fileToDataUrl(file));
});

document.addEventListener('keydown',function(e){
  if(!S.padActive) return;
  const tag=e.target&&e.target.tagName; if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(/^[0-9]$/.test(e.key)){padKey(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){padKey('DEL');e.preventDefault();}
  else if(e.key==='Enter'){padKey('GO');e.preventDefault();}
});

initStore().then(function(){ prog(); render(); });
})();
</script>
</body>
